# Regenerates the visual baselines on the CI runner image and commits them to the
# branch this was dispatched on. Never main: baselines are proposed on a branch
# and reviewed as images in a pull request, then merged like any other change.
# Dispatch it on the branch that carries the UI change, or CI stays red, because
# baselines made from main's pixels do not match the change:
#
#   git push -u origin <the branch with the UI change>
#   gh workflow run visual-baselines --ref <that branch>
#     -f prune=true         # only after deleting or renaming a story: removes its pictures
#   gh run watch
#   gh pr create            # or, on an already-open pull request, release the CI run
#                           # the bot's push created (it is held, action_required):
#                           # gh api -X POST repos/<owner>/<repo>/actions/runs/<id>/approve
#
# Orphan PNGs (a story deleted or renamed) are pruned only with `prune=true`, so a
# story the manifest lost by accident fails the confirm step as a missing picture
# instead of losing it. Actions are pinned to commits here, not tags: this job can push.
name: visual-baselines

on:
  workflow_dispatch:
    inputs:
      prune:
        description: Delete baselines no story or view names any more (after a deliberate story deletion or rename)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04 # must match ci.yml: the baselines are this image's rendering
    timeout-minutes: 30
    steps:
      - name: Never regenerate on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "baselines are proposed on a branch; dispatch this on the branch carrying the UI change" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm stories:build
      - run: pnpm exec nx build studio

      - name: Prune baselines no story or view names any more
        if: ${{ inputs.prune }}
        run: node tools/src/visual/baselines.mjs --prune

      - name: Regenerate baselines that changed or are missing
        run: pnpm visual --update-snapshots changed
        continue-on-error: true # writing is not a failure here; the next step proves the images reproduce

      - name: Confirm the regenerated baselines reproduce
        # Proves the pictures are stable, not that they are right: the pull request review judges them.
        run: pnpm visual

      - name: Commit the baselines to this branch
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git add -A tools/src/visual/baselines
          if git diff --cached --quiet; then
            echo "baselines unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test(visual): regenerate baselines on ubuntu-24.04" -m "Generated by $RUN_URL"
          git push origin "HEAD:$BRANCH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-baselines
          path: |
            tools/src/visual/baselines
            test-results/visual
            playwright-report/visual
          if-no-files-found: ignore
          retention-days: 7
