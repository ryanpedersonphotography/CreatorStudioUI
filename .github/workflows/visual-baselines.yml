# Regenerates the visual baselines on the CI runner image and commits them to the
# branch this was dispatched on. Never main: baselines are proposed on a branch
# and reviewed as images in a pull request, then merged like any other change.
#
#   git switch -c visual/<why> && git push -u origin HEAD
#   gh workflow run visual-baselines --ref visual/<why>
#   gh run watch            # then open (or re-run CI on) the pull request
name: visual-baselines

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04 # must match ci.yml: the baselines are this image's rendering
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm stories:build
      - run: pnpm exec nx build studio

      - name: Regenerate baselines that changed or are missing
        run: pnpm visual --update-snapshots changed
        continue-on-error: true # a write is not a failure; the next step is the judge

      - name: Confirm the regenerated baselines pass as committed
        run: pnpm visual

      - name: Commit the baselines to this branch
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git add -A tools/src/visual/baselines
          if git diff --cached --quiet; then
            echo "baselines unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test(visual): regenerate baselines on ubuntu-24.04" -m "Generated by $RUN_URL"
          git push origin "HEAD:$BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: |
            tools/src/visual/baselines
            test-results/visual
            playwright-report/visual
          if-no-files-found: ignore
